# Stella-VSLAM, monocular: celular Android (HONOR WDY-LX3, trasera) 1280x720
#
# INTRÍNSECOS ESTIMADOS, NO CALIBRADOS (docs/STELLA_INTEGRATION.md, etapa 2): mediana del FoV que
# predice LingBot-Map en captures/streaming/sin_guardar/sesion_20261004_194615/eval/sesion.npz (escalado x4/3),
# reescalada de la imagen de 518 de ancho a la resolución completa; principal en el centro; sin
# distorsión. Sirven para arrancar y medir; reemplazar por una calibración con patrón cuando se haga.
# Debe recibir la imagen YA ROTADA como la ve LingBot (el publicador aplica la misma rotación).

Camera:
  name: "celular Android (HONOR WDY-LX3, trasera) 1280x720"
  setup: "monocular"
  model: "perspective"
  fx: 1043.1
  fy: 1042.1
  cx: 640.0
  cy: 360.0
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0
  fps: 15.0
  cols: 1280
  rows: 720
  color_order: "RGB"

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.9
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20

# Relocalización y cierre de bucle quedan con los valores por defecto de stella_vslam.
